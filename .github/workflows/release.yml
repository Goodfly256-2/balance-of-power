name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pygame-ce pyinstaller

      - name: Regression test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python _fix_stress.py

      - name: Build exe (PyInstaller)
        run: pyinstaller BalanceOfPower.spec --noconfirm

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = python -c "import version; print(version.VERSION)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$v installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BalanceOfPower-windows
          path: |
            dist/BalanceOfPower.exe
            dist/BalanceOfPower-Setup-*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/BalanceOfPower-Setup-*.exe
            dist/BalanceOfPower.exe
          generate_release_notes: true
